
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750e8">
  <title>DeutschUp — Learn Languages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202044;
      background: linear-gradient(135deg, #f3f0ff, #e9f7ff);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 620px;
      background: white;
      border-radius: 28px;
      padding: 42px 26px;
      text-align: center;
      box-shadow: 0 20px 60px #30208020;
    }
    .logo {
      width: 86px;
      height: 86px;
      border-radius: 25px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      color: white;
      font-size: 42px;
      background: linear-gradient(135deg, #7557f6, #4296ff);
    }
    h1 { font-size: 42px; margin: 0 0 12px; }
    p { color: #62627a; line-height: 1.7; }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 16px 25px;
      border-radius: 14px;
      background: #6750e8;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }
    .button:hover { background: #5038ce; }
    .note { font-size: 13px; margin-top: 20px; }
    footer { margin-top: 28px; font-size: 12px; color: #85859a; }
  </style>
</head>
<body>
  <main>
    <div class="logo">🌍</div>
    <h1>DeutschUp</h1>
    <p><strong>Learn languages. Level up your skills.</strong></p>
    <p>Practice languages with lessons, grammar exercises, speaking practice, stories, and progress tracking.</p>

    <a class="button"
       href="https://github.com/alisinaj986-ship-it/DeutschUp/releases/latest/download/app-release.apk">
       Download for Android
    </a>

    <p class="note">Android app • Version 1.0.0</p>
    <footer>© 2026 DeutschUp</footer>
  </main>
</body>
</html>
